<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karanlık Zindan">
<meta name="theme-color" content="#0b0a10">
<link rel="manifest" href="manifest.json">
<title>Karanlık Zindan RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2.0.0">

</head>
<body>
<canvas id="bg"></canvas>
<div id="sp"><svg viewBox="0 0 100 100" width="104" height="104"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3cf7a"/><stop offset="1" stop-color="#a8741a"/></linearGradient></defs><path d="M50 6L14 18v30c0 24 16 38 36 46 20-8 36-22 36-46V18z" fill="#15111f" stroke="url(#sg)" stroke-width="3"/><path d="M30 68L70 28M70 68L30 28" stroke="url(#sg)" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="48" r="7" fill="#15111f" stroke="url(#sg)" stroke-width="3"/></svg>
<h1>KARANLIK ZİNDAN</h1><div class="sb2">RPG</div><div class="spb"><i></i></div><div id="spt"></div><div class="sk2">Geçmek için dokun</div></div>
<div id="vg"></div><div id="tt"></div>

<!-- Tam Ekran Karakter Seçim & Oluşturma Ekranı -->
<div id="cs-screen">
  <div class="cs-stage">
    <div class="cs-bg-layer" id="cs-bg-layer"></div>
    <div class="cs-vignette"></div>
    <div class="cs-top">
      <div class="r">
        <div>
          <h2 id="cs-header-title" style="font-family:var(--hd);color:var(--gold);font-size:19px;letter-spacing:2px;text-shadow:0 2px 8px #000">KARAKTER SEÇİMİ</h2>
          <p id="cs-header-sub" style="font-size:11px;color:#e2e8f0;text-shadow:0 1px 4px #000">Sınıfları incele · Alttaki yuvalardan oyna veya oluştur</p>
        </div>
        <button id="cs-mode-btn" class="btn s" style="display:none;width:auto;padding:6px 10px;font-size:11px;background:rgba(24,21,35,.48);backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.2)" onclick="toggleCsMode()">← Yuvalar</button>
      </div>
    </div>
    <div class="cs-bottom" id="cs-bottom-area"></div>
  </div>
</div>

<div class="app">
<header>
  <div class="r">
    <div style="display:flex;align-items:center">
      <span class="lvb" id="hl"></span>
      <div>
        <div><span class="nm" id="hn"></span><span class="cb" id="hc"></span></div>
        <div id="htitle" style="font-size:9px;color:var(--gold);font-weight:700"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700"><span class="g">🪙 <span id="hg"></span></span><span style="color:#a5b4fc">🎒 <span id="hb"></span>/50</span><button class="btn s" style="width:auto;padding:4px 7px;font-size:10px;border:1px solid rgba(230,180,80,.4)" onclick="openCharSelect()" title="Karakter Seçim Ekranına Dön">👥 Yuvalar</button><button class="btn s" id="fsb" style="width:auto;padding:4px 7px;font-size:11px;border:1px solid rgba(230,180,80,.4)" onclick="toggleFS()" title="Tam ekran">⛶</button></div>
  </div>
  <div class="bar"><i class="hpf" id="hh"></i><b id="ht"></b></div>
  <div class="bar"><i class="mpf" id="hm"></i><b id="hmt"></b></div>
  <div class="bar" style="height:5px"><i class="xpf" id="hx"></i></div>
</header>
<main id="mv"></main>
<nav id="nv"></nav>
</div>

<div class="mo" id="im"><div class="mm2" id="ic"></div></div>
<div id="class-lore-modal" onclick="if(event.target===this)closeClassLore()"></div>


<script src="engine.js?v=2.0.0"></script>
<script src="game.js?v=2.0.0"></script>
<script src="cloud.js?v=2.0.0"></script>
<script src="community.js?v=2.0.0"></script>
<script src="pazar.js?v=2.0.0"></script>
</body>
</html>
